name: Flutter CI
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  sample-apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [shop_cart_app, chat_starter, ride_hail_starter]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Pub get
        run: flutter pub get
        working-directory: sample-apps/${{ matrix.app }}
      - name: Analyze
        run: flutter analyze
        working-directory: sample-apps/${{ matrix.app }}
      - name: Test
        run: flutter test
        working-directory: sample-apps/${{ matrix.app }}
